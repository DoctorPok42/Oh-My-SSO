<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{text .Title}}</title>
<link rel="icon" type="image/svg+xml" href="{{.Assets}}/icon.svg">
<link rel="stylesheet" href="{{.Assets}}/omsso.css">
<link rel="stylesheet" href="{{.Assets}}/login.css">
</head>
<body>
<main class="auth">
<div class="auth-inner">
<div class="auth-card">
  {{template "logo"}}
  <h1 class="auth-title">{{text .Title}}</h1>
  <div class="auth-body">
  <p>{{text .Text}}</p>
  {{with .Back}}<a class="btn btn-md btn-block" href="{{.URL}}">{{t "message.back_to" "Back to {app}" "app" .Name}}</a>{{end}}
  </div>
</div>
{{template "auth-footer"}}
</div>
</main>
</body>
</html>
