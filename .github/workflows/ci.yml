name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.7"
  NODE_VERSION: "22.12.0"
  DOCKER_REPOSITORY: doctorpok/omsso

jobs:
  go:
    name: Go checks
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go tests
        run: go test -p 1 ./... -short -race -count=1

  admin:
    name: Admin checks
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build admin console
        run: npm run build

  docker:
    name: Docker ${{ matrix.image }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    needs: [go, admin]
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - image: idp
            context: .
            target: idp
          - image: idp-admin
            context: .
            target: idp-admin
          - image: admin
            context: ./admin
            target: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: |
            ${{ env.DOCKER_REPOSITORY }}:${{ matrix.image }}-${{ github.sha }}
            ${{ env.DOCKER_REPOSITORY }}:${{ matrix.image }}-latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
