# Release: a tag vX.Y.Z on a commit of main whose CI passed (the `docker` job of
# ci.yml pushed <image>-<sha>). The images are not rebuilt: the ones the CI
# tested get the tag <image>-X.Y.Z, are signed with cosign (keyless: the
# signature names this workflow and the tag) and carry an SBOM (SPDX).
# Process and manual steps: CHANGELOG.md. Verification: docs/PRODUCTION.md.

name: Release

on:
  push:
    tags: ["v*"]

env:
  DOCKER_REPOSITORY: doctorpok/omsso

permissions:
  contents: read

jobs:
  notes:
    name: Check the tag and the changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is a semantic version, on main, with changelog notes
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          bash scripts/release_notes.sh "$GITHUB_REF_NAME" >/dev/null

  images:
    name: Release ${{ matrix.image }}
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless signature (Sigstore)
    strategy:
      fail-fast: false
      matrix:
        image: [idp, idp-admin, migrate, admin]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the image the CI built for this commit
        id: tag
        run: |
          version=${GITHUB_REF_NAME#v}
          src="$DOCKER_REPOSITORY:${{ matrix.image }}-$GITHUB_SHA"
          dst="$DOCKER_REPOSITORY:${{ matrix.image }}-$version"
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          # Fails if the CI of this commit did not push the image: nothing is released.
          want=$(digest_of "$src")
          # A released version never changes: a moved or re-pushed tag must not replace it.
          if old=$(digest_of "$dst" 2>/dev/null) && [ "$old" != "$want" ]; then
            echo "::error::$dst already exists with other content"
            exit 1
          fi
          docker buildx imagetools create -t "$dst" "$src"
          digest=$(digest_of "$dst")
          echo "ref=$DOCKER_REPOSITORY@$digest" >>"$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image
        run: cosign sign --yes "${{ steps.tag.outputs.ref }}"

      - name: Build the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.tag.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attach the SBOM to the image
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${{ steps.tag.outputs.ref }}"

  github-release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release_notes.sh "$GITHUB_REF_NAME" >notes.md
          # 1.0.0-rc.1: marked as a pre-release, not the latest release.
          flag=""; [[ $GITHUB_REF_NAME == *-* ]] && flag=--prerelease
          gh release create "$GITHUB_REF_NAME" $flag --title "$GITHUB_REF_NAME" --notes-file notes.md
