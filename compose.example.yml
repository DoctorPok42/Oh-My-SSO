# Oh-My-SSO on one host with Docker Compose (docs/PRODUCTION.md):
#   cp compose.example.yml compose.yml   # then the lines marked EDIT
#   cp .env.example .env && chmod 600 .env
#   docker compose up -d
# Every setting lives in .env: idp and idp-admin read it whole (env_file), the
# other services take their values from it (${...}). This file holds no
# secret. New version: scripts/deploy.sh.
#
# Networks:
#   edge   idp, idp-admin, admin: egress (OVH KMS, SMTP). Gateway 172.30.20.1:
#          the address of the host's reverse proxy as idp sees it.
#   admin  internal: the console (172.30.10.10) -> Admin API (172.30.10.20:8090)
#   data   internal: idp, idp-admin -> PostgreSQL, Valkey
# Published, on 127.0.0.1 only, for the TLS reverse proxy of the host (nginx):
# idp :8080 and the console :3000.
#
# Local development (`make dev`) uses the services of the "dev" profile at
# the end of this file, never the others.

name: oh-my-sso

services:
  # TLS reverse proxy in this file instead of on the host (docs/PRODUCTION.md,
  # section 4): uncomment, then remove the ports of idp and admin and the
  # extra_hosts of admin, and set TRUSTED_PROXIES=172.30.20.10 in .env.
  # nginx:
  #   image: nginx:1.28
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./nginx/oh-my-sso.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #     - ./nginx/acme:/var/www/acme:ro # certbot --webroot -w ./nginx/acme
  #   depends_on: [idp, admin]
  #   networks:
  #     edge:
  #       ipv4_address: 172.30.20.10 # = TRUSTED_PROXIES
  #       # The console reaches the IdP through nginx (https, valid
  #       # certificate): the OIDC issuer must match exactly. EDIT: the host
  #       # name of PUBLIC_URL.
  #       aliases: [sso.example.com]
  #   restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d sso"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8
    volumes: [valkey-data:/data]
    networks: [data]
    restart: unless-stopped

  # One-shot, before idp and idp-admin start: database migrations (Atlas,
  # versioned files of ent/migrate). They come from this checkout: keep it on
  # the commit of the images (scripts/deploy.sh pulls it).
  migrate:
    image: arigaio/atlas:1.3.3-community
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - postgres://sso:${POSTGRES_PASSWORD:?}@postgres:5432/sso?sslmode=disable
    volumes: [./ent/migrate/migrations:/migrations:ro]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

  idp:
    image: doctorpok/omsso:idp-${IMAGE_IDP:-latest}
    # build: { context: ., target: idp } # instead of image: from this checkout
    env_file: .env
    volumes:
      - ./certs:/certs:ro # OVH KMS client certificate (OVHKMS_CLIENT_*_FILE)
      # - ./locales:/locales:ro # extra languages: LOCALES_DIR=/locales (docs/I18N.md)
    ports: ["127.0.0.1:8080:8080"] # the reverse proxy of the host
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_started }
    networks:
      data: {}
      # Default route through edge: egress, and the published port, whose
      # requests then come from edge's gateway (172.30.20.1 = TRUSTED_PROXIES).
      edge: { gw_priority: 1 }
      # mailcow: {} # mail server of another compose project, see networks
    # extra_hosts: ["mail.example.com:172.22.1.253"] # SMTP_HOST -> its container
    read_only: true
    restart: unless-stopped

  idp-admin:
    image: doctorpok/omsso:idp-admin-${IMAGE_IDP_ADMIN:-latest}
    # build: { context: ., target: idp-admin }
    env_file: .env
    volumes:
      - ./certs:/certs:ro
      # - ./locales:/locales:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_started }
    networks:
      data: {}
      admin: { ipv4_address: 172.30.10.20 } # = ADMIN_API_URL of the console
      edge: {} # egress only (OVH KMS, SMTP): no port published
      # mailcow: {}
    # extra_hosts: ["mail.example.com:172.22.1.253"]
    read_only: true
    restart: unless-stopped

  admin:
    image: doctorpok/omsso:admin-${IMAGE_ADMIN:-latest}
    # build: { context: ./admin }
    environment:
      OIDC_ISSUER: ${PUBLIC_URL:-http://localhost:8080}/r/master
      OIDC_CLIENT_ID: sso-admin
      # Empty until the bootstrap: the console then answers with a
      # configuration error (docs/PRODUCTION.md, section 5).
      OIDC_CLIENT_SECRET: ${ADMIN_OIDC_CLIENT_SECRET:-}
      ADMIN_URL: ${ADMIN_PANEL_URL:-http://localhost:3000}
      ADMIN_API_URL: http://172.30.10.20:8090 # idp-admin
      SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      DEFAULT_REALM: master
      # ADMIN_LOCALES_DIR: /admin-locales # extra languages, with the volume below
    # volumes: ["./admin-locales:/admin-locales:ro"]
    ports: ["127.0.0.1:3000:3000"] # the reverse proxy of the host
    # The console's server calls the IdP at PUBLIC_URL (the OIDC issuer must
    # match exactly): through the reverse proxy of the host, with its valid
    # certificate. EDIT: the host name of PUBLIC_URL.
    extra_hosts: ["sso.example.com:host-gateway"]
    depends_on: [idp, idp-admin]
    networks:
      edge: {}
      admin: { ipv4_address: 172.30.10.10 } # = ADMIN_API_ALLOWED_CIDRS
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    restart: unless-stopped

  # ===== Local development only ==============================================
  # Profile "dev": `make dev` starts these, as a separate project
  # (oh-my-sso-dev), never `docker compose up`. They are the data stack of the
  # servers run on the host (docs/GETTING-STARTED.md), unrelated to the
  # services above: a production compose.yml may drop them.
  dev-postgres:
    profiles: [dev]
    image: postgres:16
    environment:
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
      POSTGRES_DB: sso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d sso"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports: ["5432:5432"]
    volumes: [dev-db-data:/var/lib/postgresql/data]

  dev-valkey:
    profiles: [dev]
    image: valkey/valkey:8
    ports: ["6379:6379"]
    volumes: [dev-valkey-data:/data]

  dev-vault:
    profiles: [dev]
    image: hashicorp/vault:latest
    command: ["vault", "server", "-dev"] # in memory: keys are lost on restart
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

  dev-mailpit:
    profiles: [dev]
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"] # SMTP, inbox http://localhost:8025

networks:
  edge:
    ipam: { config: [{ subnet: 172.30.20.0/24 }] }
  admin:
    internal: true
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }
  data:
    internal: true
  # Mail server of another compose project on this host (e.g. Mailcow): join
  # its network, then point SMTP_HOST at its SMTP container (extra_hosts of
  # idp and idp-admin above). If the audit log then shows this network's
  # gateway instead of client addresses, add it to TRUSTED_PROXIES.
  # mailcow:
  #   external: true
  #   name: mailcowdockerized_mailcow-network

volumes:
  db-data: {}
  valkey-data: {}
  dev-db-data: {}
  dev-valkey-data: {}
