# SonarQube Cloud automatic analysis reads this file (sonar-project.properties
# is only for a scanner run by the CI, and ignored here).
# ent/ is generated by `make generate`: each field adds near-identical setters,
# so it must not count as duplicated code.
sonar.cpd.exclusions=ent/**
# Nor be analysed at all: issues there cannot be fixed by hand. Its sources
# are ent/schema/*.go, declarative (fields, edges, indexes).
sonar.exclusions=ent/**
